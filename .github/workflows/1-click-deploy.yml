name: 1-Click Deploy
on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Auto setup vars
        id: vars
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=8byte-tf-state-$ACCOUNT" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          aws s3api head-bucket --bucket 8byte-tf-state-$ACCOUNT 2>/dev/null || aws s3 mb s3://8byte-tf-state-$ACCOUNT --region ${{ secrets.AWS_REGION }}
          aws dynamodb describe-table --table-name 8byte-tf-lock --region ${{ secrets.AWS_REGION }} 2>/dev/null || aws dynamodb create-table --table-name 8byte-tf-lock --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region ${{ secrets.AWS_REGION }}

      - name: Get or create DB password
        run: |
          PASS=$(aws ssm get-parameter --name /8byte/db_password --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
          if [ -z "$PASS" ]; then
            PASS=$(openssl rand -base64 16 | tr -d '\n')
            aws ssm put-parameter --name /8byte/db_password --type SecureString --value "$PASS" --overwrite --region ${{ secrets.AWS_REGION }}
          fi
          echo "DB_PASS=$PASS" >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform init -backend-config="bucket=$BUCKET" -backend-config="key=8byte/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}" -backend-config="dynamodb_table=8byte-tf-lock"
          terraform apply -auto-approve -var="db_password=$DB_PASS"

      - name: Build Push Deploy
        working-directory: app
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGION=${{ secrets.AWS_REGION }}
          ECR=$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/arshit-8byte-app
          aws ecr describe-repositories --repository-names arshit-8byte-app --region $REGION || aws ecr create-repository --repository-name arshit-8byte-app --region $REGION
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT.dkr.ecr.$REGION.amazonaws.com
          docker build -t arshit-8byte-app:${{ github.sha }} .
          docker tag arshit-8byte-app:${{ github.sha }} $ECR:latest
          docker tag arshit-8byte-app:${{ github.sha }} $ECR:${{ github.sha }}
          docker push $ECR:latest
          docker push $ECR:${{ github.sha }}
          aws ecs update-service --cluster arshit-8byte-cluster --service arshit-8byte-svc --force-new-deployment --region $REGION

      - name: Post-deploy stabilization
        id: stabilize
        working-directory: terraform
        run: |
          set -e
          REGION=${{ secrets.AWS_REGION }}
          CLUSTER="arshit-8byte-cluster"
          SERVICE="arshit-8byte-svc"

          TG_ARN=$(terraform output -raw target_group_arn 2>/dev/null || aws elbv2 describe-target-groups --names arshit-8byte-tg --region $REGION --query 'TargetGroups[0].TargetGroupArn' --output text)
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || aws elbv2 describe-load-balancers --names arshit-8byte-alb --region $REGION --query 'LoadBalancers[0].DNSName' --output text)
          
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT

          echo "⏳ Waiting for ECS service to be stable..."
          aws ecs wait services-stable --cluster $CLUSTER --services $SERVICE --region $REGION

          echo "⏳ Waiting for ALB targets healthy..."
          aws elbv2 wait target-in-service --target-group-arn $TG_ARN --region $REGION

          echo "✅ Testing health endpoint..."
          for i in {1..12}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health || true)
            if [ "$CODE" = "200" ]; then
              echo "App is UP at http://$ALB_DNS"
              exit 0
            fi
            echo "Attempt $i: got $CODE, retrying in 10s..."
            sleep 10
          done
          echo "❌ App did not become healthy"
          exit 1

      - name: Deployment Summary
        run: |
          ALB="${{ steps.stabilize.outputs.alb_dns }}"
          echo ""
          echo "🚀 Deployment complete!"
          echo "Open this link: http://$ALB"
          echo ""
          {
            echo "### ✅ Deployment Complete"
            echo ""
            echo "Your app is now live."
            echo ""
            echo "**URL:** http://$ALB"
            echo ""
            echo "[👉 Click here to open the app](http://$ALB)"
          } >> $GITHUB_STEP_SUMMARY
