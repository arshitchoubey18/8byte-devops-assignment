name: 1-Click Deploy
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create backend bucket & lock table
        run: |
          aws s3api head-bucket --bucket ${{ secrets.TF_BUCKET }} 2>/dev/null || aws s3 mb s3://${{ secrets.TF_BUCKET }} --region ${{ secrets.AWS_REGION }}
          aws dynamodb describe-table --table-name 8byte-tf-lock --region ${{ secrets.AWS_REGION }} 2>/dev/null || \
          aws dynamodb create-table --table-name 8byte-tf-lock --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform init -backend-config="bucket=${{ secrets.TF_BUCKET }}" -backend-config="key=8byte/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}" -backend-config="dynamodb_table=8byte-tf-lock"
          terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Build & Push Docker
        working-directory: app
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR=$ACCOUNT.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/arshit-8byte-app
          aws ecr describe-repositories --repository-names arshit-8byte-app --region ${{ secrets.AWS_REGION }} || aws ecr create-repository --repository-name arshit-8byte-app --region ${{ secrets.AWS_REGION }}
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ACCOUNT.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          docker build -t arshit-8byte-app .
          docker tag arshit-8byte-app:latest $ECR:latest
          docker push $ECR:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster arshit-8byte-cluster --service arshit-8byte-svc --force-new-deployment --region ${{ secrets.AWS_REGION }}
          echo "Waiting 90s for task..."
          sleep 90

      - name: Show URL
        working-directory: terraform
        run: |
          echo "APP URL: http://$(terraform output -raw alb_dns_name)"
